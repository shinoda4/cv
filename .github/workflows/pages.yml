name: Web résumé / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "cv/**"
      - "cv.regular.typ"
      - "cv-en.typ"
      - "cv.regular.pdf"
      - "cv-en.pdf"
      - "assets/me.jpg"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "cv/**"
      - "cv.regular.typ"
      - "cv-en.typ"
      - "cv.regular.pdf"
      - "cv-en.pdf"
      - "assets/me.jpg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cv
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cv/package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test, lint, type-check, and build
        run: bun run verify

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: cv/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
